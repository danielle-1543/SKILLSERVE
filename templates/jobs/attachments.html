{% if offer.attachments.all %}<div class="job-media">{% for attachment in offer.attachments.all %}{% if attachment.kind == 'image' %}<a href="{% url 'job_attachment' attachment.pk %}" target="_blank" rel="noopener"><img src="{% url 'job_attachment' attachment.pk %}" alt="{{ attachment.name }}" loading="lazy"></a>{% elif attachment.kind == 'video' %}<video controls preload="metadata"><source src="{% url 'job_attachment' attachment.pk %}">Your browser cannot play this video.</video>{% else %}<a class="job-document" href="{% url 'job_attachment' attachment.pk %}">📎 {{ attachment.name }} <span>Open file ↓</span></a>{% endif %}{% endfor %}</div>{% endif %}
