<section class="panel profile-section"><h2>Review history and administrator feedback</h2>{% for review in reviews %}<article class="review-history-item"><div><span class="status-badge status-{{ review.decision }}">{{ review.get_decision_display }}</span><small>{{ review.created_at|date:'M j, Y · g:i A' }} · Submission {{ review.revision }}</small></div><p>{{ review.feedback|linebreaksbr }}</p></article>{% empty %}<p class="muted">No administrator feedback yet.</p>{% endfor %}</section>
