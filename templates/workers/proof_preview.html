<figure class="proof-preview"><figcaption>{{ item.label }}</figcaption>{% if item.preview_type == 'pdf' %}<iframe class="proof-document" src="{% url 'worker_evidence' item.pk %}#toolbar=0" title="{{ item.label }} — PDF preview"></iframe>{% elif item.preview_type == 'video' %}<video controls controlslist="nodownload" preload="metadata" class="proof-video"><source src="{% url 'worker_evidence' item.pk %}">Your browser cannot play this video.</video>{% else %}<img class="proof-image" src="{% url 'worker_evidence' item.pk %}" alt="{{ item.label }}">{% endif %}</figure>
