{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page_title }} | SkillServe</title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block extra_css %}{% endblock %}<link rel="stylesheet" href="{% static 'css/redesign.css' %}"><link rel="stylesheet" href="{% static 'css/dialogs.css' %}">
</head>

<body class="account-site admin-site">
{% include 'accounts/navigation.html' %}
    <main class="main-content">
        <header class="page-header">
            <h1>{{ page_title }}</h1>
        </header>

        <!-- Display confirmation or error messages after an action. -->
        {% for message in messages %}
            <p class="notice" role="status">{{ message }}</p>
        {% endfor %}

        {% block content %}{% endblock %}
    </main>


<script src="{% static 'js/navigation.js' %}" defer></script>

{% block scripts %}{% endblock %}
</body>
</html>
